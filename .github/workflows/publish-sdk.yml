name: Publish Java SDK to Maven Central

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17 and Maven Central credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            pom.xml
            alppay-sdk-java/pom.xml
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD

      - name: Read release version from tag
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ['GITHUB_REF_NAME']
          match = re.fullmatch(r'v((?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))', tag)
          if os.environ['GITHUB_REF_TYPE'] != 'tag' or not match:
              raise SystemExit('Release tag must use vX.Y.Z, for example v1.0.1')
          version = match.group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          print(f'Release version: {version}')
          PY

      - name: Build SDK, sources, Javadoc and standalone POM
        id: build
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          SDK_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          -f alppay-sdk-java/pom.xml -Prelease
          -Disys.version="$RELEASE_VERSION"
          -Dsdk.project.url="$SDK_PROJECT_URL"
          -Dsdk.scm.tag="$RELEASE_TAG"
          -Dgpg.skip=true clean verify

      - name: Sign and publish SDK
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ github.ref_name }}
          SDK_PROJECT_URL: ${{ github.server_url }}/${{ github.repository }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        shell: bash
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_KEY MAVEN_GPG_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing publishing credential: $name. See docs/sdk-publishing.md."
              exit 1
            fi
          done
          mvn --batch-mode --no-transfer-progress \
            -f alppay-sdk-java/pom.xml -Prelease \
            -Disys.version="$RELEASE_VERSION" \
            -Dsdk.project.url="$SDK_PROJECT_URL" \
            -Dsdk.scm.tag="$RELEASE_TAG" \
            -Dgpg.signer=bc deploy

      - name: Save SDK artifacts
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: alppay-sdk-java-${{ steps.version.outputs.version }}
          path: |
            alppay-sdk-java/target/*.jar
            alppay-sdk-java/target/*.asc
            alppay-sdk-java/target/central-publishing/central-bundle.zip
            alppay-sdk-java/.flattened-pom.xml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Write publication summary
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          Published SDK: \`com.aialphay.alppay:alppay-sdk-java:$RELEASE_VERSION\`

          Source tag: \`$GITHUB_REF_NAME\`

          Source commit: \`$GITHUB_SHA\`

          \`\`\`xml
          <dependency>
            <groupId>com.aialphay.alppay</groupId>
            <artifactId>alppay-sdk-java</artifactId>
            <version>$RELEASE_VERSION</version>
          </dependency>
          \`\`\`
          EOF
